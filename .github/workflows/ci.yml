name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Primary quality gate: lint, typecheck, unit/integration tests, build, audit.
  node:
    name: Node 22 (lint · typecheck · test · build · audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yurupager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yurupager"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yurupager
      DATABASE_URL: postgres://yurupager_app:yurupager_app@127.0.0.1:5432/yurupager
      CONNECTOR_DATABASE_URL: postgres://yurupager_connector:yurupager_connector@127.0.0.1:5432/yurupager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run build:all
      - run: npm audit --omit=dev

  # Playwright end-to-end suite. Allowed to fail while it stabilises on CI;
  # flip continue-on-error to false once green.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yurupager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yurupager"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/yurupager
      DATABASE_URL: postgres://yurupager_app:yurupager_app@127.0.0.1:5432/yurupager
      CONNECTOR_DATABASE_URL: postgres://yurupager_connector:yurupager_connector@127.0.0.1:5432/yurupager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/playwright
            artifacts/screenshots
            test-results
          retention-days: 7
          if-no-files-found: ignore

  # Swift package build and core sanity checks. Allowed to fail while the
  # macOS runner setup settles; flip continue-on-error to false once green.
  ios:
    name: iOS swift build + core checks
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        working-directory: apps/ios
        run: swift build
      - name: yurupager-core-checks
        working-directory: apps/ios
        run: swift run yurupager-core-checks
