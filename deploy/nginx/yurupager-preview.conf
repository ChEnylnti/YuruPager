server {
  # 8889 is already admitted by the current cloud security group. A stream
  # listener splits plaintext HTTP (the existing File Browser) from TLS
  # (YuruPager preview) before either protocol is parsed.
  listen 127.0.0.1:18443 ssl http2;
  server_name 117.50.192.44;

  ssl_certificate /etc/letsencrypt/live/yurupager-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yurupager-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  access_log off;
  error_log /dev/null crit;
  client_max_body_size 16m;

  location / {
    proxy_pass http://127.0.0.1:4301;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
