services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yurupager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yurupager"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - yurupager-postgres:/var/lib/postgresql/data

  alpha:
    profiles: ["alpha"]
    build: .
    restart: unless-stopped
    environment:
      PORT: 4300
      HOST: 0.0.0.0
      AUTH_MODE: local
      ALPHA_PASSWORD: ${ALPHA_PASSWORD:-alpha-demo}
      SESSION_SECRET: ${SESSION_SECRET:-local-alpha-session-secret-change-before-production}
      ADMIN_DATABASE_URL: postgres://postgres:postgres@postgres:5432/yurupager
      DATABASE_URL: postgres://yurupager_app:yurupager_app@postgres:5432/yurupager
      CONNECTOR_DATABASE_URL: postgres://yurupager_connector:yurupager_connector@postgres:5432/yurupager
      WEB_ORIGIN: http://127.0.0.1:4300
      CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:-alpha-connector-token}
      CONNECTOR_WORKSPACE_ID: ${CONNECTOR_WORKSPACE_ID:-20000000-0000-4000-8000-000000000002}
      CONNECTOR_WORKSTATION_ID: ${CONNECTOR_WORKSTATION_ID:-30000000-0000-4000-8000-000000000001}
      PREVIEW_ENABLED: "true"
      PREVIEW_GATEWAY_HOST: 0.0.0.0
      PREVIEW_GATEWAY_PORT: 4301
      PREVIEW_PUBLIC_ORIGIN: http://preview.localhost:4301
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4300:4300"
      - "4301:4301"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4300/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  yurupager-postgres:
